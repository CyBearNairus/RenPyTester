# Builds the single-file executables from a tagged commit and attaches them to a GitHub release
# (spec DIST-002, DIST-003, DIST-005, DIST-006). Started by pushing a tag such as v0.1.0, which must
# be the version in renpytester/__init__.py.
#
# Each executable is tested before it is released: the end-to-end tests are run from source, and then
# against the executable on the newest and the oldest supported Ren'Py.
# The Windows executable is required. The Linux and macOS ones are attached when their build and
# tests pass, and left out when they do not, without holding back the release (DIST-003 is a SHOULD).
name: Release

on:
  push:
    tags: ["v*"]
  # Started by hand, it builds and tests the executables and releases nothing: a rehearsal.
  workflow_dispatch:

permissions:
  contents: read

env:
  RENPY_NEWEST: "8.6.0"
  RENPY_OLDEST: "8.0.3"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: github.ref_type == 'tag'
        run: python tools/build_exe.py --tag "$GITHUB_REF_NAME"
      - run: python -m pip install flake8
      - run: python -m flake8 .
      - run: python tools/lint_rpy.py
      - run: npx --yes markdownlint-cli2 "**/*.md"

  build:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ !matrix.required }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            built: dist/renpytester.exe
            asset: renpytester-windows-x64.exe
            required: true
          # The oldest Linux on offer, so that the executable runs on older systems too.
          - os: ubuntu-22.04
            built: dist/renpytester
            asset: renpytester-linux-x64
            required: false
          - os: macos-latest
            built: dist/renpytester
            asset: renpytester-macos-arm64
            required: false
          - os: macos-15-intel
            built: dist/renpytester
            asset: renpytester-macos-x64
            required: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pyinstaller

      # The engine is downloaded for the tests and never committed or put in the executable (NFR-006).
      - name: Keep the Ren'Py SDKs between runs
        id: sdk
        uses: actions/cache@v4
        with:
          path: .cache/sdk
          key: renpy-sdk-${{ runner.os }}-${{ env.RENPY_NEWEST }}-${{ env.RENPY_OLDEST }}
      - name: Download the Ren'Py SDKs
        if: steps.sdk.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p .cache/sdk
          for version in "$RENPY_NEWEST" "$RENPY_OLDEST"; do
            if [ "$RUNNER_OS" = "Windows" ]; then
              curl -fsSL -o sdk.zip "https://www.renpy.org/dl/$version/renpy-$version-sdk.zip"
              unzip -q sdk.zip -d .cache/sdk
              rm sdk.zip
            else
              curl -fsSL "https://www.renpy.org/dl/$version/renpy-$version-sdk.tar.bz2" | tar -xj -C .cache/sdk
            fi
          done

      - name: Unit tests
        run: python -m pytest tests/unit
      - name: End-to-end tests, from source
        run: python -m pytest tests/e2e

      - name: Build the executable
        run: python tools/build_exe.py

      - name: End-to-end tests, the executable, newest Ren'Py
        shell: bash
        run: RENPYTESTER_EXE="$PWD/${{ matrix.built }}" python -m pytest tests/e2e
      - name: End-to-end tests, the executable, oldest Ren'Py
        shell: bash
        run: >
          RENPYTESTER_EXE="$PWD/${{ matrix.built }}" RENPY_SDK="$PWD/.cache/sdk/renpy-$RENPY_OLDEST-sdk"
          python -m pytest tests/e2e

      - name: Keep the logs of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failures-${{ matrix.asset }}
          path: .cache/failures
          if-no-files-found: ignore

      - name: Name the executable for the release
        shell: bash
        run: |
          mkdir release
          cp "${{ matrix.built }}" "release/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: release/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: [lint, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: renpytester-*
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" release/*
          --repo "$GITHUB_REPOSITORY"
          --title "RenPyTester $GITHUB_REF_NAME"
          --generate-notes --verify-tag
