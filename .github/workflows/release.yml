# Builds the single-file executables from a tagged commit and attaches them to a GitHub release
# (spec DIST-002, DIST-003, DIST-005, DIST-006). Started by pushing a tag such as v0.1.0, which must
# be the version in renpytester/__init__.py.
#
# Each executable is tested before it is released: the end-to-end tests are run from source, and then
# against the executable on the newest and the oldest supported Ren'Py.
# The Windows executable is required. The Linux and macOS ones are attached when their build and
# tests pass, and left out when they do not, without holding back the release (DIST-003 is a SHOULD).
# Windows has two: the window program, which a double click opens with no console, and the console
# program for terminals and build servers (CLI-007). The whole suite is run against the console
# program; the window program is the same code, and is given the tests that are about the executable.
name: Release

on:
  push:
    tags: ["v*"]
  # Started by hand, it builds and tests the executables and releases nothing: a rehearsal.
  workflow_dispatch:

permissions:
  contents: read

env:
  RENPY_NEWEST: "8.6.0"
  RENPY_OLDEST: "8.0.3"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: The tag is this version's
        if: github.ref_type == 'tag'
        shell: bash
        run: python tools/build_exe.py --tag "$GITHUB_REF_NAME" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Say that this is a rehearsal
        if: github.ref_type != 'tag'
        run: echo "**Rehearsal**, started by hand on \`$GITHUB_REF_NAME\`. Nothing is released." >> "$GITHUB_STEP_SUMMARY"
      - run: python -m pip install flake8
      - name: Python (flake8)
        run: |
          python -m flake8 .
          echo "- Python (flake8): no problems" >> "$GITHUB_STEP_SUMMARY"
      - name: Ren'Py scripts (tools/lint_rpy.py)
        run: |
          python tools/lint_rpy.py
          echo "- Ren'Py scripts (tools/lint_rpy.py): no problems" >> "$GITHUB_STEP_SUMMARY"
      - name: Markdown (markdownlint)
        run: |
          npx --yes markdownlint-cli2 "**/*.md"
          echo "- Markdown (markdownlint): no problems" >> "$GITHUB_STEP_SUMMARY"
      - if: failure()
        run: echo "- **A check failed.** Its step's log says why." >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ !matrix.required }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            built: dist/renpytester.exe
            asset: renpytester-windows-x64-console.exe
            windowed: dist/renpytesterw.exe
            windowed_asset: renpytester-windows-x64.exe
            required: true
          # The oldest Linux on offer, so that the executable runs on older systems too.
          - os: ubuntu-22.04
            built: dist/renpytester
            asset: renpytester-linux-x64
            required: false
          - os: macos-latest
            built: dist/renpytester
            asset: renpytester-macos-arm64
            required: false
          - os: macos-15-intel
            built: dist/renpytester
            asset: renpytester-macos-x64
            required: false
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pyinstaller

      # The engine is fetched for the tests and never committed or put in the executable (NFR-006).
      - uses: ./.github/actions/renpy-sdk
        with:
          versions: ${{ env.RENPY_NEWEST }} ${{ env.RENPY_OLDEST }}

      - name: Unit tests
        run: python -m pytest tests/unit
      - name: End-to-end tests, from source
        run: python -m pytest tests/e2e

      - name: Build the executable
        run: python tools/build_exe.py

      - name: End-to-end tests, the executable, newest Ren'Py
        run: RENPYTESTER_EXE="$PWD/${{ matrix.built }}" python -m pytest tests/e2e
      - name: End-to-end tests, the executable, oldest Ren'Py
        run: >
          RENPYTESTER_EXE="$PWD/${{ matrix.built }}" RENPY_SDK="$PWD/.cache/sdk/renpy-$RENPY_OLDEST-sdk"
          python -m pytest tests/e2e

      - name: Tests of the executable itself, the window program
        if: matrix.windowed
        run: RENPYTESTER_EXE="$PWD/${{ matrix.windowed }}" python -m pytest tests/e2e/test_executable.py

      - name: Keep the logs of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failures-${{ matrix.asset }}
          path: .cache/failures
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Say that this executable is left out
        if: failure() && !matrix.required
        run: echo "**${{ matrix.asset }} did not pass and is left out of the release.**" >> "$GITHUB_STEP_SUMMARY"

      - name: Name the executable for the release
        run: |
          mkdir release
          cp "${{ matrix.built }}" "release/${{ matrix.asset }}"
          if [ -n "${{ matrix.windowed }}" ]; then
            cp "${{ matrix.windowed }}" "release/${{ matrix.windowed_asset }}"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: release/
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: [lint, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          pattern: renpytester-*
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" release/*
          --repo "$GITHUB_REPOSITORY"
          --title "RenPyTester $GITHUB_REF_NAME"
          --generate-notes --verify-tag
      - name: Say what was released
        run: |
          {
            echo "## Released [$GITHUB_REF_NAME]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME)"
            echo
            echo "| File | Size | SHA-256 |"
            echo "| --- | --- | --- |"
            for file in release/*; do
              echo "| \`$(basename "$file")\` | $(du -k "$file" | cut -f1) KB | \`$(sha256sum "$file" | cut -d' ' -f1)\` |"
            done
            echo
            for name in renpytester-linux-x64 renpytester-macos-arm64 renpytester-macos-x64; do
              [ -e "release/$name" ] || echo "- \`$name\` did not pass its tests and was left out."
            done
          } >> "$GITHUB_STEP_SUMMARY"
