# Checks every push and pull request: the linters (spec NFR-008, NFR-009), the unit tests on every
# supported Python and system (spec 7.3, COMPAT-001, COMPAT-006), and an install as a package (DIST-004).
# The end-to-end tests need a Ren'Py SDK and run when a release is built (release.yml).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install flake8
      - run: python -m flake8 .
      - run: python tools/lint_rpy.py
      - run: npx --yes markdownlint-cli2 "**/*.md"

  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - run: python -m pytest tests/unit

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install .
      # From another folder, so that the installed copy is what runs and not the clone.
      - run: renpytester --version
        working-directory: ${{ runner.temp }}
      - run: renpytester cache list
        working-directory: ${{ runner.temp }}
