# Checks every push and pull request: the linters (spec NFR-008, NFR-009), the unit tests on every
# supported Python and system (spec 7.3, COMPAT-001, COMPAT-006), an install as a package (DIST-004),
# and the end-to-end tests from source on the newest Ren'Py.
# The end-to-end tests against the executable, and on the oldest Ren'Py, run when a release is built
# (release.yml), which leaves the tests this workflow has already run from source to this one.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A push made while an earlier one is still being checked takes its place.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RENPY_NEWEST: "8.6.0"
  RENPY_OLDEST: "8.0.3"
  # How many end-to-end tests run at a time. Each starts game processes of its own, and the runners
  # have three or four processors.
  E2E_WORKERS: "3"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install flake8
      - name: Python (flake8)
        run: |
          python -m flake8 .
          echo "- Python (flake8): no problems" >> "$GITHUB_STEP_SUMMARY"
      - name: Ren'Py scripts (tools/lint_rpy.py)
        run: |
          python tools/lint_rpy.py
          echo "- Ren'Py scripts (tools/lint_rpy.py): no problems" >> "$GITHUB_STEP_SUMMARY"
      - name: Markdown (markdownlint)
        run: |
          npx --yes markdownlint-cli2 "**/*.md"
          echo "- Markdown (markdownlint): no problems" >> "$GITHUB_STEP_SUMMARY"
      - if: failure()
        run: echo "- **A linter reported problems.** Its step's log lists them." >> "$GITHUB_STEP_SUMMARY"

  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        # Every Python on Linux; the oldest and the newest on the other two, where what differs is
        # the system and not the Python.
        exclude:
          - {os: windows-latest, python: "3.12"}
          - {os: windows-latest, python: "3.13"}
          - {os: macos-latest, python: "3.12"}
          - {os: macos-latest, python: "3.13"}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - run: python -m pytest tests/unit

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install .
      # From another folder, so that the installed copy is what runs and not the clone.
      - working-directory: ${{ runner.temp }}
        run: |
          renpytester cache list
          echo "Installed as a package: \`$(renpytester --version)\` runs." >> "$GITHUB_STEP_SUMMARY"

  # Also what keeps the SDKs in the cache for the release workflow: see .github/actions/renpy-sdk.
  e2e:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pytest-xdist
      - uses: ./.github/actions/renpy-sdk
        with:
          versions: ${{ env.RENPY_NEWEST }} ${{ env.RENPY_OLDEST }}
      - run: python -m pytest tests/e2e -n ${{ env.E2E_WORKERS }}
      - name: Keep the logs of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failures-${{ matrix.os }}
          path: .cache/failures
          include-hidden-files: true
          if-no-files-found: ignore
