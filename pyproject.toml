[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "renpytester"
description = "Automatically plays through a Ren'Py game and reports what is broken."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = []
dynamic = ["version"]

[project.optional-dependencies]
dev = ["pytest", "flake8"]

[project.scripts]
renpytester = "renpytester.cli:main"

[tool.setuptools]
packages = ["renpytester", "renpytester.report"]

[tool.setuptools.dynamic]
version = { attr = "renpytester.__version__" }

[tool.setuptools.package-data]
renpytester = ["harness/*.rpy", "locale/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "req(*ids): the specification requirement IDs this test verifies (docs/SPEC.md section 7.3)",
    "e2e: runs a real Ren'Py engine; needs an SDK (RENPY_SDK or .cache/sdk)",
]
